<ion-app>
  <ion-menu side="start" menuId="main-menu" contentId="main-content">
    <ion-header id="menu-header">
      <ion-toolbar>
        <div id="menu-lista-usuario">
          <div id="menu-lista-usuario-perfil">
            <img class="icone-botao-perfil" [src]="perfil.foto" alt="foto de perfil" id="icone-perfil">
            <div>
              <p>{{nomeCrianca}}</p>
              <p id="usuarioLogado">{{usuarioLogado}}</p>
            </div>
          </div>
          <div id="menu-lista-usuario-botoes">
            <ion-button routerLink="/configuracoes"  id="menu-lista-usuario-botoes-config" (click)="fechaMenu()">
              <ion-icon class="icone-botao" name="settings-outline"></ion-icon>
              Configurações
            </ion-button>
            <ion-button (click)="logout(false); fechaMenu()" id="menu-lista-usuario-botoes-sair">
              <ion-icon class="icone-botao" name="log-out-outline"></ion-icon>
              Sair
            </ion-button>
          </div>
        </div>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list id="menu-lista">
        <div id="menu-lista-nav">
          <ion-item routerLink="/home" routerDirection="root" class="menu-item-lista" (click)="fechaMenu()">
            <ion-icon name="home-outline"></ion-icon>
            Início
          </ion-item>
          <ion-item routerLink="/contato" routerDirection="root" class="menu-item-lista" (click)="fechaMenu()">
            <ion-icon name="at-outline"></ion-icon>
            Fale conosco
          </ion-item>
          <ion-item routerLink="/sobre" routerDirection="root" class="menu-item-lista" (click)="fechaMenu()">
            <ion-icon name="information-circle-outline"></ion-icon>
            Sobre nós
          </ion-item>
        </div>    
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
