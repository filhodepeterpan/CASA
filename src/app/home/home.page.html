<ion-header [translucent]="true" *ngIf="logado">
  <ion-toolbar id="barra-app">
    <ion-buttons slot="start" id="botao-header">
      <ion-menu-button autoHide="false" *ngIf="!categoriaEscolhida"></ion-menu-button>
      <ion-back-button *ngIf="categoriaEscolhida" (click)="volta()" defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title id="titulo-app">
      <div id="titulo-app-logo">
        <h1>C A S A</h1>     
        <ion-icon name="home-outline" id="titulo-app-logo-casa"></ion-icon>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="!logado && cadastrado" id="pagina-de-login">

    <ion-row id="pagina-de-login-itens">
      <ion-col [size]="colSizeLoginSection">
        <img src="assets/CASA.png" width="100%" class="ion-padding">
      </ion-col>

      <ion-col [size]="colSizeLoginSection">
      <form #loginpage="ngForm" (ngSubmit)="login(loginpage)" class="ion-padding" id="login-container-caixa">
        <div id="login-container-caixa-form">
          <ion-item class="login-container-caixa-form-item">
            <ion-label position="floating">Usuário</ion-label>
            <ion-input required [(ngModel)]="usuario" type="text" name="usuario"></ion-input>
          </ion-item>

          <ion-item class="login-container-caixa-form-item">
            <ion-label position="floating">Senha</ion-label>
            <ion-input
              required
              [(ngModel)]="senha"
              [type]="mostrarSenha ? 'text' : 'password'"
              name="senha">
            </ion-input>
            <ion-icon
              slot="end"
              [name]="mostrarSenha ? 'eye-off' : 'eye'"
              (click)="alternaVisibilidadeSenha()"
              size="small"
              class="icone-senha">
            </ion-icon>
          </ion-item>

        </div>

        <ion-button id="entrar" expand="full" type="submit" [disabled]="loginpage.invalid">
          <ion-icon name="enter-outline"></ion-icon>
        </ion-button>

        <p class="ion-text-center texto-login">Não tem uma conta ainda? <a class="link" (click)="solicitaCadastro()">Cadastre-se</a></p>

      </form>
    </ion-col>
  </ion-row>
  </div>

  <form #cadastro="ngForm" (ngSubmit)="finalizaCadastro()" *ngIf="!cadastrado" class="login-container">
    <div class="ion-padding" id="login-container-caixa">

      <div id="login-container-caixa-form">
        <ion-item class="login-container-caixa-form-item">
          <ion-label position="floating">Nome do Tutor</ion-label>
          <ion-input required type="text" [(ngModel)]="nomeTutor" name="nomeTutor"></ion-input>
        </ion-item>

        <ion-item class="login-container-caixa-form-item">
          <ion-label position="floating">Nome da Criança</ion-label>
          <ion-input required type="text" [(ngModel)]="nomeCrianca" name="nomeCrianca"></ion-input>
        </ion-item>
        <ion-item class="login-container-caixa-form-item">
          <ion-label position="floating">ID do C.A.S.A</ion-label>
          <ion-input required type="text" [(ngModel)]="idCasa" name="idCasa"></ion-input>
        </ion-item>
        <ion-item class="login-container-caixa-form-item">
          <ion-label position="floating">Email</ion-label>
          <ion-input required type="email" [(ngModel)]="email" name="email"></ion-input>
        </ion-item>
        <ion-item class="login-container-caixa-form-item">
          <ion-label position="floating">Usuário</ion-label>
          <ion-input required [(ngModel)]="usuario" type="text" name="usuario"></ion-input>
        </ion-item>

        <ion-item class="login-container-caixa-form-item">
          <ion-label position="floating">Senha</ion-label>
          <ion-input required [(ngModel)]="senha" type="password" name="senha"></ion-input>
        </ion-item>

        <ion-item class="login-container-caixa-form-item">
          <ion-label position="floating">Confirmar senha</ion-label>
          <ion-input required type="password" name="confirmacaoSenha"></ion-input>
        </ion-item>
      </div>

      <ion-button id="entrar" expand="full" type="submit" [disabled]="cadastro.invalid">
        <ion-icon name="create-outline"></ion-icon>
      </ion-button>

      <p class="ion-text-center texto-login">Já tem uma conta? <a class="link" (click)="voltaLogin()">Logar</a></p>

    </div>
  </form>

  <div *ngIf="logado">

    <ion-grid id="categorias" *ngIf="!categoriaEscolhida">
      <ion-row>
        <ion-col [size]="colSizeCard" *ngFor="let categoria of categorias" class="categorias-container">
          <ion-card (click)="selecionaCategoria(categoria)" class="categorias-card categoria" color="{{categoria.cor}}">
            <ion-card-header>
              <ion-icon [name]="categoria.icone" size="large" class="categoria-icone"></ion-icon>
            </ion-card-header>
            <ion-card-content class="categoria-titulo">
              {{categoria.nome}}
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div *ngIf="carregando" class="overlay">
      <div class="spinner"></div>
    </div>

    <ion-grid *ngIf="categoriaEscolhida">

      <h1 id="categoria-nome">{{categoria}}</h1>
      <ion-row>

        <ion-col [size]="colSizeCard" *ngFor="let card of cardsFiltrados" class="card-container">
          <div (click)="escolheCard(card.som_url)">
              <img [src]="card.imagem_url" alt="{{card.titulo}}" class="card-imagem"  width="250" loading="lazy"/>              
          </div>
        </ion-col>

      </ion-row>
    </ion-grid>
  </div>
</ion-content>
